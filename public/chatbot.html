<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Assistance - Krishi Veda</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Chatbot button styling */
        #chatbot-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(45deg, #28a745, #34c38f);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            z-index: 1000;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        #chatbot-button:hover {
            background: linear-gradient(45deg, #34c38f, #28a745);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        #chatbot-button:active {
            background: linear-gradient(45deg, #28a745, #34c38f);
            transform: translateY(0);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Chatbot iframe container styling */
        #chatbot-container {
            display: none;
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 300px;
            height: 400px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            overflow: hidden;
        }

        #chatbot-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>Krishi Veda</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="chatbot.html">Chatbot Assistance</a></li>
                <li><a href="index.html#authentication">Product Authentication</a></li>
                <li><a href="index.html#subsidy">Subsidy Finder</a></li>
                <li><a href="index.html#weather">Weather & Alerts</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="chatbot">
        <div class="content">
            <h2>Real-Time Chatbot Assistance</h2>
            <img src="images/chatbot.jpg" alt="Chatbot Interaction" class="section-img">
            <p>Welcome to the Chatbot Assistance page. Here you can interact with our chatbot for real-time support.</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Krishi Veda. All rights reserved.</p>
    </footer>

    <!-- Chatbot button and container -->
    <button id="chatbot-button">Chat with us</button>
    <div id="chatbot-container">
        <iframe src="https://cdn.botpress.cloud/webchat/v2/shareable.html?botId=242d0307-f6b9-4792-bd88-84422d3d9149"></iframe>
    </div>

    <script>
        const chatbotButton = document.getElementById('chatbot-button');
        const chatbotContainer = document.getElementById('chatbot-container');

        chatbotButton.addEventListener('click', () => {
            if (chatbotContainer.style.display === 'none' || chatbotContainer.style.display === '') {
                chatbotContainer.style.display = 'block';
            } else {
                chatbotContainer.style.display = 'none';
            }
        });
    </script>
</body>
</html>
